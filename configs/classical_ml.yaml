# Classical Machine Learning Configuration
seed: 42

models:
  decision_tree:
    class_name: "DecisionTreeClassifier"
    max_depth: 4
    criterion: "entropy"
    random_state: 42

  knn:
    class_name: "KNeighborsClassifier"
    n_neighbors: 5
    weights: "uniform"
    algorithm: "auto"

  logistic_regression:
    class_name: "LogisticRegression"
    use_random_search: true
    param_distributions:
      C: [0.001, 0.01, 0.1, 1.0, 10.0, 100.0]
    n_iter: 6
    cv: 5
    random_state: 42
    max_iter: 1000

  svm:
    class_name: "SVC"
    C: 1.0
    kernel: "rbf"
    probability: true
    random_state: 42
    # For large datasets (284k), standard SVC(probability=True) is computationally heavy;
    # LinearSVC / CalibratedClassifierCV or sample subset can be optionally configured
    sample_size_limit: null

  random_forest:
    class_name: "RandomForestClassifier"
    n_estimators: 100
    criterion: "entropy"
    random_state: 42
    n_jobs: -1

  xgboost:
    class_name: "XGBClassifier"
    n_estimators: 100
    learning_rate: 0.1
    max_depth: 6
    eval_metric: "logloss"
    random_state: 42
    n_jobs: -1

  elm:
    class_name: "ELMClassifier"
    n_hidden_nodes: 50
    activation: "relu"
    random_state: 42

experiments:
  datasets:
    - name: "standardized_amount" # primary paper setting
      scale_amount_only: true
    - name: "all_standardized"
      scale_amount_only: false
    - name: "selected_features"
      scale_amount_only: true
      use_feature_selection: true
      top_k: 15
