# Base Experiment Configuration
seed: 42
environment:
  python_version: "3.11"
  deterministic: true

data:
  raw_path: "data/raw/creditcard.csv"
  processed_dir: "data/processed"
  target_column: "Class"
  time_column: "Time"
  amount_column: "Amount"
  expected_rows: 284807
  expected_fraud: 492
  expected_legit: 284315
  expected_features: 30

split:
  test_size: 0.20
  random_state: 42
  stratify: true

preprocessing:
  scaler_type: "StandardScaler" # Applied to Amount
  scale_amount_only: true
  drop_time: false # 30 features if false, 29 features if true
  fitted_on_train_only: true

feature_selection:
  enabled: false
  method: "random_forest" # options: "random_forest", "anova_f"
  top_k: 20

output:
  reports_dir: "reports"
  figures_dir: "reports/figures"
  results_dir: "reports/results"
  checkpoints_dir: "artifacts/checkpoints"
  model_summaries_dir: "artifacts/model_summaries"
